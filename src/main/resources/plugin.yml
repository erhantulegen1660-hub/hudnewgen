name: AegisHUD
version: 1.0.0
main: ru.aegis.hud.AegisHud
api-version: '1.21'
description: HUD (scoreboard) для Aegis - хаб и королевская битва
commands:
  aegishud:
    description: Управление HUD, стадиями и статистикой
    aliases: [hud]
    usage: /<command>
  amethyst:
    description: Аметисты (донат-валюта)
    aliases: [ametist, ametisty]
    usage: /<command> <give|take|set|balance> <ник> <число>
permissions:
  aegis.admin:
    description: Админ-команды AegisHUD
    default: op
